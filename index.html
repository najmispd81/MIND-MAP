<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wemoction - Jurus Kelola Emosi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .wheel-container {
            position: relative;
            width: 330px;
            height: 330px;
            margin: 0 auto;
        }
        @media(min-width: 640px) {
            .wheel-container {
                width: 380px;
                height: 380px;
            }
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        /* Ring Luar 6 Juring Pastel Presisi */
        #outerRing {
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: conic-gradient(
                #ffb3ba 0deg 60deg,
                #ffdfba 60deg 120deg,
                #baffc9 120deg 180deg,
                #bae1ff 180deg 240deg,
                #ffc6ff 240deg 300deg,
                #e8baff 300deg 360deg
            );
            border: 4px solid #ffffff;
        }

        /* Ring Dalam 6 Juring Pastel Terang */
        #innerRing {
            top: 17.5%; left: 17.5%;
            width: 65%; height: 65%;
            background: conic-gradient(
                #f8fafc 0deg 60deg,
                #fff7ed 60deg 120deg,
                #f0fdf4 120deg 180deg,
                #eff6ff 180deg 240deg,
                #faf5ff 240deg 300deg,
                #fdf2f8 300deg 360deg
            );
            border: 3px solid #ffffff;
            z-index: 10;
        }

        /* Teks & Ikon Terdistribusi Melingkar */
        .slice-content {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            display: flex; flex-col;
            align-items: center; justify-content: flex-start;
            pointer-events: none;
        }

        .center-pin {
            position: absolute;
            top: 42%; left: 42%;
            width: 16%; height: 16%;
            background: radial-gradient(circle, #cbd5e1 0%, #64748b 100%);
            border-radius: 50%;
            z-index: 20;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-[#a8e6cf] text-slate-800 min-h-screen flex flex-col justify-between font-sans pb-6">

    <!-- Header / Banner Atas -->
    <header class="pt-6 pb-2 text-center px-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-[#0f2c59] tracking-tight">WHEEL OF EMOTION</h1>
        <h2 class="text-xl sm:text-2xl font-bold text-[#0f2c59] mb-2">(WEMOCTION):</h2>
        
        <div class="inline-block bg-[#1b4965] text-white font-black text-sm sm:text-base px-6 py-1.5 rounded-md shadow-md">
            JURUS KELOLA EMOSI
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 w-full flex-grow flex flex-col items-center">
        
        <!-- Area Roda Putar -->
        <div class="wheel-container my-4">
            <!-- Panah Penunjuk Atas (Merah) -->
            <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-30 w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[22px] border-t-red-600 drop-shadow-md"></div>

            <!-- Ring Luar -->
            <div id="outerRing" class="ring">
                <div class="slice-content" style="transform: rotate(30deg);"><div class="mt-3 text-center text-slate-800 font-extrabold text-[11px] leading-tight"><i class="fa-solid fa-face-angry text-sm block mb-0.5 text-red-500"></i>Kritik/<br>Bully</div></div>
                <div class="slice-content" style="transform: rotate(90deg);"><div class="mt-3 text-center text-slate-800 font-extrabold text-[11px] leading-tight"><i class="fa-solid fa-file-xmark text-sm block mb-0.5 text-amber-600"></i>Gagal<br>Ujian</div></div>
                <div class="slice-content" style="transform: rotate(150deg);"><div class="mt-3 text-center text-slate-800 font-extrabold text-[11px] leading-tight"><i class="fa-solid fa-people-arrows text-sm block mb-0.5 text-emerald-700"></i>Konflik<br>Keluarga</div></div>
                <div class="slice-content" style="transform: rotate(210deg);"><div class="mt-3 text-center text-slate-800 font-extrabold text-[11px] leading-tight"><i class="fa-solid fa-user-slash text-sm block mb-0.5 text-sky-700"></i>Dikucilkan</div></div>
                <div class="slice-content" style="transform: rotate(270deg);"><div class="mt-3 text-center text-slate-800 font-extrabold text-[11px] leading-tight"><i class="fa-solid fa-layer-group text-sm block mb-0.5 text-purple-700"></i>Frustrasi<br>Tugas</div></div>
                <div class="slice-content" style="transform: rotate(330deg);"><div class="mt-3 text-center text-slate-800 font-extrabold text-[11px] leading-tight"><i class="fa-solid fa-mobile-screen-button text-sm block mb-0.5 text-pink-600"></i>Insecure<br>Medsos</div></div>
            </div>

            <!-- Ring Dalam -->
            <div id="innerRing" class="ring">
                <div class="slice-content" style="transform: rotate(30deg);"><div class="mt-1.5 text-center text-slate-700 font-bold text-[8px] leading-none"><i class="fa-solid fa-lungs text-[10px] block mb-0.5 text-indigo-500"></i>STOP & Pause<br><span class="text-[7px] text-slate-500 font-normal">Jeda Napas</span></div></div>
                <div class="slice-content" style="transform: rotate(90deg);"><div class="mt-1.5 text-center text-slate-700 font-bold text-[8px] leading-none"><i class="fa-solid fa-brain text-[10px] block mb-0.5 text-amber-500"></i>Labeling<br>Emotion</div></div>
                <div class="slice-content" style="transform: rotate(150deg);"><div class="mt-1.5 text-center text-slate-700 font-bold text-[8px] leading-none"><i class="fa-solid fa-comments text-[10px] block mb-0.5 text-emerald-600"></i>CARA<br>Communication</div></div>
                <div class="slice-content" style="transform: rotate(210deg);"><div class="mt-1.5 text-center text-slate-700 font-bold text-[8px] leading-none"><i class="fa-solid fa-heart text-[10px] block mb-0.5 text-rose-500"></i>Self-<br>Compassion</div></div>
                <div class="slice-content" style="transform: rotate(27
